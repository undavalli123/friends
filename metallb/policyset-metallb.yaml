---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: policyset-metallb
  namespace: rhacm-policies
spec:
  description: >-
    Install the Red Hat MetalLB Operator and configure its IPAddressPool and
    L2Advertisement on all brand_group=gms managed clusters.
  policies:
    - policy-metallb-operator
    - policy-metallb-config

---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-metallb
  namespace: rhacm-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: brand_group
              operator: In
              values:
                - gms

---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-policyset-metallb
  namespace: rhacm-policies
placementRef:
  name: placement-metallb
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: policyset-metallb
    apiGroup: policy.open-cluster-management.io
    kind: PolicySet
